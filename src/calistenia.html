<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calistenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23e8590c%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27900%27%3E%E5%8A%9B%3C/text%3E%3C/svg%3E">
<style>
/* ===== Tema 和紙 (claro) — mismo sistema que MEXT Forge, con acento naranja propio ===== */
:root{--bg:#f6f0e4;--surface:#fffdf8;--surface2:#f2eadb;--text:#211b17;--muted:#74695e;--line:#e4d8c4;
  --accent:#e8590c;--accent2:#b07d12;--accent-t:#fff;--ok:#1d8a50;--okbg:#e2f3e8;--bad:#c9302c;--badbg:#fbe6e2;--warn:#b26b00;--warnbg:#fbefd9;--focus:#d63a2f;
  --glow:rgba(232,89,12,.16);--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
  --push:#d63a2f;--pull:#2457d6;--legs:#1c9459;--skill:#7348d1;--full:#bb7400;--eval:#0b8aa3}
/* ===== Tema 夜 (oscuro) ===== */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e1b;--surface:#161a2d;--surface2:#1f2440;--text:#f2efe8;--muted:#a2a5bc;--line:#2a2f4f;
  --accent:#ff8f4d;--accent2:#ffc857;--accent-t:#2a0e02;--ok:#3ddc84;--okbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--warn:#ffb347;--warnbg:rgba(255,179,71,.13);--focus:#ff8a7a;
  --glow:rgba(255,143,77,.22);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --push:#ff6b5e;--pull:#8fb0ff;--legs:#4fe090;--skill:#ad90ff;--full:#ffb84d;--eval:#3cc8e6}}
:root[data-theme="dark"]{--bg:#0c0e1b;--surface:#161a2d;--surface2:#1f2440;--text:#f2efe8;--muted:#a2a5bc;--line:#2a2f4f;
  --accent:#ff8f4d;--accent2:#ffc857;--accent-t:#2a0e02;--ok:#3ddc84;--okbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--warn:#ffb347;--warnbg:rgba(255,179,71,.13);--focus:#ff8a7a;
  --glow:rgba(255,143,77,.22);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --push:#ff6b5e;--pull:#8fb0ff;--legs:#4fe090;--skill:#ad90ff;--full:#ffb84d;--eval:#3cc8e6}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text);background-color:var(--bg)}
body{font-family:"Nunito","Zen Maru Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;min-height:100dvh;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--pat,none);background-attachment:fixed}
#app{max-width:780px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
body.rest-on #app{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.hide{display:none!important}
.stack>*+*{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
h3{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.card h3{margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-t);border-color:transparent;font-weight:800}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem;flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tabs{display:flex;gap:6px;padding:4px;margin-bottom:14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;min-height:48px;font-weight:800;color:var(--muted);letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.84rem;line-height:1.1}
.tabs button i{font-style:normal;font-size:1.1rem}
@media (min-width:560px){.tabs button{flex-direction:row;gap:6px;font-size:.95rem}}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.hanko{width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-weight:900;font-size:1.25rem;transform:rotate(-4deg);box-shadow:0 4px 14px var(--glow);font-family:"Zen Maru Gothic",sans-serif}
.brand b{display:block;font-size:1.15rem;letter-spacing:.02em;font-family:"Zen Maru Gothic","Nunito",sans-serif}
.brand small{color:var(--muted);font-size:.78rem}
.hero{display:flex;align-items:center;gap:16px;margin-top:16px;padding:16px;border-radius:22px;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);box-shadow:var(--shadow)}
.ring{position:relative;flex:none;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .in b{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;display:block}
.ring .in small{font-size:.7rem;color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800}
.hero .h{font-size:1.05rem;font-weight:700;margin:4px 0 10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill[data-s]{cursor:pointer}
.pill[data-s="ok"]{color:var(--ok)}.pill[data-s="warn"]{color:var(--warn)}.pill[data-s="bad"]{color:var(--bad)}.pill[data-s="muted"]{color:var(--muted)}
.start{position:relative;width:100%;margin-top:16px;border:0;border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;text-align:left;color:#fff;
  background:linear-gradient(120deg,#ff9248,#e8590c 55%,#9c2f05);box-shadow:0 10px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
.start::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.start .play{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:1.4rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.start b{display:block;font-size:1.25rem;font-family:"Zen Maru Gothic","Nunito",sans-serif;line-height:1.25}
.start small{opacity:.88;font-size:.85rem}
.start:active{transform:scale(.99)}
.start.off{background:var(--surface2);color:var(--muted);box-shadow:none;cursor:default}.start.off::after,.start.off .play{animation:none}
/* Tarjetas de sesión (como las de MEXT Forge) */
.ecard{display:flex;flex-direction:row;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;min-height:64px;box-shadow:var(--shadow)}
.edia{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-content:center;text-align:center;line-height:1;background:color-mix(in srgb,var(--c,var(--muted)) 14%,var(--surface2));color:var(--c,var(--text))}
.edia small{font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.edia b{font-size:1.45rem;font-weight:900;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--text)}
.ecuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.efecha{font-size:.74rem;font-weight:700;letter-spacing:.03em;color:var(--muted)}.efecha::first-letter{text-transform:uppercase}
.etit{font-size:1.04rem;font-weight:700;line-height:1.35;overflow-wrap:anywhere;font-family:"Zen Maru Gothic","Nunito",sans-serif}
.echips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.echip{font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.echip[data-st="hacer"]{color:var(--accent)}.echip[data-st="curso"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.echip[data-st="ent"]{color:var(--warn)}.echip[data-st="env"]{color:var(--warn);background:var(--warnbg)}.echip[data-st="cor"]{color:var(--ok)}.echip[data-st="mol"]{color:var(--bad);background:var(--badbg)}
.echev{flex:none;font-size:1.4rem;color:var(--muted);transition:transform .2s}
@media (hover:hover) and (pointer:fine){.ecard:hover .echev{transform:translateX(4px);color:var(--text)}}
.ecard.next{position:relative;overflow:hidden;padding:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 13%,var(--surface)),var(--surface) 60%)}
.ecard.next::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--accent)}
/* Ajustes */
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details[open].card summary::after{content:"－"}
.set{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;font-size:.9rem}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}
.syncbox{display:grid;gap:10px;padding:12px;border-radius:14px;background:var(--surface2)}
.syncbox label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.syncbox input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:90;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.rest-on .toast{bottom:calc(112px + env(safe-area-inset-bottom))}
.foot{margin-top:22px;text-align:center;font-size:.78rem;color:var(--muted);line-height:2}
/* ===== Sesión ===== */
.etop{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.etop h1{margin:0;font-family:"Zen Maru Gothic","Nunito",sans-serif;font-weight:900;font-size:1.5rem;letter-spacing:-.01em;line-height:1.15}
.etop h1 .ejp{display:block;font-size:.72rem;font-weight:800;letter-spacing:.3em;color:var(--c,var(--accent));margin-bottom:3px}
.back{border-radius:99px;padding:8px 14px;min-height:40px;font-weight:700}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;margin:12px -4px 0;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-variant-numeric:tabular-nums}
.bar b{font-size:1.1rem}
.bar .btn{min-height:38px;padding:6px 12px}
.prose p{margin:6px 0}.prose ul,.prose ol{margin:6px 0;padding-left:22px}.prose li{margin:2px 0}
.prose blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line);background:var(--surface2);border-radius:0 10px 10px 0}
.prose h4{margin:12px 0 4px;font-size:1rem}
.prose code{background:var(--surface2);border-radius:5px;padding:0 4px}
.callout{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:8px}
.callout.red{background:var(--badbg);color:var(--bad);font-weight:700}
.ttab{overflow-x:auto}.ttab table{border-collapse:collapse;font-size:.9rem}.ttab td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.ttab tr.hd td{font-weight:800;background:var(--surface2)}
.prio{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent);border-radius:12px;padding:8px 12px;margin:8px 0}
.retro{border-left:4px solid var(--ok)}
.sech{display:flex;align-items:center;gap:8px;margin:24px 2px 10px}
.sech .se{font-size:1.25rem}
.sech b{font-family:"Zen Maru Gothic","Nunito",sans-serif;font-size:1.08rem}
.tag{font-size:.74rem;font-weight:800;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--muted)) 14%,transparent);color:var(--c,var(--muted));white-space:nowrap}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.chk.on span{color:var(--muted);text-decoration:line-through}
/* Ejercicio */
.ex{position:relative;margin-bottom:12px;padding:14px 14px 12px;overflow:hidden}
.ex::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--line))}
.ex.dim{opacity:.55}
.ex.st-plan,.ex.st-hecho{--c:var(--ok)}.ex.st-ajustado{--c:var(--warn)}.ex.st-omit-t,.ex.st-omit-f,.ex.st-fallado{--c:var(--muted)}
.exh{display:flex;gap:10px;align-items:flex-start}
.exn{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:var(--surface2);color:var(--accent);font-variant-numeric:tabular-nums}
.ex.pri .exn{background:var(--accent);color:var(--accent-t)}
.exname{font-weight:800;font-size:1.06rem;line-height:1.3}
.exchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.exchips .tag{--c:var(--text)}.exchips .tag.dose{--c:var(--accent)}
.exnote{font-size:.9rem;color:var(--muted);margin-top:6px}
.cues{margin:8px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;min-height:38px;font-size:.9rem;font-weight:700}
.vbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.sets{margin-top:10px;display:grid;gap:6px}
.srow{display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;background:var(--surface2);transition:background .2s}
.srow.ok{background:var(--okbg)}.srow.om{opacity:.5}
.srow.om .sn{text-decoration:line-through}
.sn{flex:none;width:28px;font-weight:900;font-size:.85rem;color:var(--muted);text-align:center}
.fld{display:flex;flex-direction:column;flex:1;min-width:0}
.fld small{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:3px}
.fld input{width:100%;min-width:0;min-height:40px;padding:6px 8px;font-size:16px;font-weight:800;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.fld input:focus{outline:0;border-color:var(--accent)}
.fld.rir{flex:.7}.fld.kg{flex:.9}
.sb{flex:none;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:900;display:grid;place-items:center;align-self:flex-end}
.sb.sok.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.sb.hold{color:var(--accent);border-color:var(--accent)}
.sb.som{color:var(--muted)}.sb.som.on{background:var(--muted);color:var(--bg)}
.exact{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.exact button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;min-height:36px;font-size:.84rem;font-weight:700}
.exact .planb{border-color:var(--ok);color:var(--ok)}.exact .planb.on{background:var(--ok);color:var(--bg)}
.exact .on{border-color:var(--text);background:var(--text);color:var(--bg)}
.exact .molb{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.estl{font-size:.8rem;font-weight:800;margin-top:8px;color:var(--c,var(--muted))}
.exnota{width:100%;margin-top:8px;min-height:44px;padding:8px 10px;font-size:16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);resize:vertical}
.mol{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--badbg);color:var(--bad);font-weight:700;font-size:.88rem}
.mol button{margin-left:auto;border:0;background:transparent;color:inherit;font-weight:900}
.dec{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:.92rem;border:1px solid var(--line)}
.dec b{margin-right:4px}.dec.up{background:var(--okbg);border-color:var(--ok)}.dec.up b{color:var(--ok)}
.dec.down{background:var(--warnbg);border-color:var(--warn)}.dec.down b{color:var(--warn)}.dec.eq b{color:var(--muted)}
.medias{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mthumb{position:relative;width:64px;height:64px;border-radius:10px;background:var(--surface2) center/cover;border:1px solid var(--line);display:grid;place-items:center;font-size:1.3rem}
.mthumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:.7rem}
.mthumb .up{position:absolute;bottom:2px;right:4px;font-size:.7rem}
.circ .ctr{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;border-radius:12px;background:var(--surface2)}
.circ .big{font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums;min-width:96px}
.circ .cnt{display:flex;align-items:center;gap:6px;margin-left:auto}
.circ .cnt b{min-width:34px;text-align:center;font-size:1.3rem;font-variant-numeric:tabular-nums}
.citem{padding:8px 0;border-top:1px solid var(--line)}.citem:first-of-type{border-top:0}
.checkin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkin .fld input{font-weight:700}
.checkin .full{grid-column:1/-1}
.e15{display:flex;gap:6px}.e15 button{flex:1;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:900}
.e15 button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
.sendb{width:100%;margin-top:16px}
/* Descanso (barra fija abajo) */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(748px,calc(100% - 24px));z-index:60;display:none;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--text);color:var(--bg);box-shadow:0 12px 34px rgba(0,0,0,.28);overflow:hidden}
#rest.on{display:flex;animation:rise .25s ease-out}
#rest .rt{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#rest .rl{font-size:.75rem;opacity:.75}
#rest button{white-space:nowrap;border:0;border-radius:10px;padding:8px 12px;min-height:42px;font-weight:800;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
#rest .rp{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .25s linear}
#rest.done{background:var(--ok)}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* Superposición (isometría, molestia, entrega) */
#ov{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(10,8,6,.45);padding:12px}
#ov.on{display:flex}
@media (min-width:640px){#ov{align-items:center}}
.sheet{width:min(560px,100%);max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 10px;font-family:"Zen Maru Gothic","Nunito",sans-serif;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;min-height:40px;font-weight:700;font-size:.9rem}
.chip.on{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.chip.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.holdbig{font-size:5.5rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1;margin:18px 0 6px}
.holdbig.prep{color:var(--warn)}.holdbig.goal{color:var(--ok)}
.holdtg{text-align:center;color:var(--muted);font-weight:700}
.sheet .acts{display:flex;gap:10px;margin-top:16px}.sheet .acts .btn{flex:1}
.urow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.urow:first-of-type{border-top:0}.urow b{flex:1;min-width:140px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted)}
/* ===== Habilidades ===== */
.hab{margin-bottom:10px}
.habh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.habh b{font-size:1.04rem;font-family:"Zen Maru Gothic","Nunito",sans-serif;flex:1}
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:10px}
.step{font-size:.82rem;font-weight:800;padding:5px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted)}
.step.done{border-color:transparent;background:var(--okbg);color:var(--ok)}
.step.now{border-color:var(--accent);background:var(--accent);color:var(--accent-t);box-shadow:0 4px 14px var(--glow)}
.arr{color:var(--muted);font-size:.8rem}
.habm{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.84rem;color:var(--muted)}
.dots{letter-spacing:3px;color:var(--accent);font-weight:900}
.viejo{opacity:.6}
.vbars{display:flex;align-items:flex-end;gap:4px;height:44px;margin-top:8px}
.vbars i{flex:1;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 55%,var(--surface2));min-height:2px;position:relative}
.vbars i.now{background:var(--accent)}
.vbars i span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:.65rem;font-weight:800;color:var(--muted);font-style:normal}
/* ===== Gráficos SVG sin librerías (como en MEXT Forge) ===== */
.csvg{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.cgrid{stroke:var(--line);stroke-width:1}
.cax{font-size:10px;fill:var(--muted);font-family:inherit}
.clbl{font-size:10px;font-weight:800;fill:var(--text);font-family:inherit;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.cvacio{padding:14px 0}
.cleg{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin-top:4px}.cleg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
select.sel{width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
/* ===== Fondo propio (imagen de este dispositivo; la paleta sale de la imagen) — igual que en MEXT Forge ===== */
#fondo{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:-1;background:var(--bg) center/cover no-repeat;pointer-events:none;animation:aFade .6s both}
#fondo::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--fvel,.35);transition:opacity .2s}
html.fondo body{background:transparent}
html.fondo .card,html.fondo .ecard,html.fondo .icon-btn,html.fondo .pill,html.fondo .hero,html.fondo .tabs,html.fondo .kpi,html.fondo .bar{-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
html.fondo .start:not(.off){background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 62%,#000),color-mix(in srgb,var(--accent) 45%,#000) 55%,color-mix(in srgb,var(--accent2) 38%,#000))}
html.fondo h3,html.fondo .foot,html.fondo .sech b{text-shadow:0 0 6px var(--bg),0 0 2px var(--bg)}
.fgal{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fgal .fth{position:relative;width:78px;height:54px;border-radius:10px;border:2px solid var(--line);background:var(--surface2) center/cover;padding:0}
.fgal .fth.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.fgal .fx{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:.7rem;display:grid;place-items:center;color:var(--muted)}
.fgal .fadd{width:78px;height:54px;border-radius:10px;border:2px dashed var(--line);background:none;font-size:1.4rem;color:var(--muted)}
.fpal{display:flex;gap:4px;align-items:center}.fpal i{width:16px;height:16px;border-radius:5px;border:1px solid var(--line)}
#fVel{width:min(220px,50vw);accent-color:var(--accent)}
/* ===== Animaciones (con «reducir movimiento» del sistema se apagan todas) ===== */
@keyframes aIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes aFade{from{opacity:0}to{opacity:1}}
@keyframes aPop{0%{transform:scale(.9)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes aRing{from{transform:rotate(-260deg);opacity:0}to{transform:rotate(-90deg);opacity:1}}
@keyframes aGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}}
@keyframes aStep{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes aGrowY{from{transform:scaleY(0)}to{transform:none}}
@keyframes aDraw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
#app.enter>*{animation:aIn .5s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}
#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(6){animation-delay:.2s}#app.enter>*:nth-child(7){animation-delay:.24s}#app.enter>*:nth-child(n+8){animation-delay:.28s}
#app.enter .ladder>*{animation:aStep .45s cubic-bezier(.2,.8,.2,1) both}
#app.enter .ladder>*:nth-child(3){animation-delay:.08s}#app.enter .ladder>*:nth-child(5){animation-delay:.16s}#app.enter .ladder>*:nth-child(7){animation-delay:.24s}#app.enter .ladder>*:nth-child(n+9){animation-delay:.32s}
#app.enter .ring svg{animation:aRing .9s cubic-bezier(.2,.8,.2,1) both}
#app.enter .vbars i,#app.enter .csvg rect{transform-origin:bottom;transform-box:fill-box;animation:aGrowY .7s .2s cubic-bezier(.2,.8,.2,1) both}
#app.enter .csvg polyline{stroke-dasharray:1200;animation:aDraw 1.1s .2s ease-out both}
.step.now{animation:aGlow 2.2s ease-in-out infinite}
button,.btn,.card,.ecard,.chip,.vbtn,.srow,.sb{transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background-color .2s,border-color .2s,opacity .2s,color .2s}
button:active:not(:disabled){transform:scale(.97)}
.pop{animation:aPop .32s cubic-bezier(.2,.8,.2,1)}
.srow.ok .sn{color:var(--ok)}
.bar .btn.pri{animation:aGlow 2.2s ease-in-out infinite}
@media (hover:hover) and (pointer:fine){
  .ecard:hover,.hab:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.10)}
  .btn:hover,.icon-btn:hover,.chip:hover,.vbtn:hover,.exact button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .icon-btn:hover{transform:translateY(-1px) rotate(-4deg)}
  .start:not(.off):hover{transform:translateY(-3px) scale(1.01);box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 30%,transparent)}
  .start:not(.off):hover .play{animation:aPop .5s}
}
@media (max-width:420px){.ring{width:92px;height:92px}.ring .in b{font-size:1.6rem}.hero{gap:12px;padding:14px}.fld.rir{flex:.6}.sb{width:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="rest" role="timer" aria-live="polite"></div>
<div id="ov" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="fileIn" type="file" accept="video/*,image/*" class="hide">
<input id="imp" type="file" accept="application/json" class="hide">
<script>
"use strict";
// Calistenia — el instructor planifica en Notion; la app muestra, registra y envía. Nunca califica.
// Datos propios con prefijo «calistenia» (comparte dominio con MEXT Ráfaga y MEXT Forge).
const KEY="calistenia.v1",BK="calistenia.bor.v1",RK="calistenia.timers.v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const hoyISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const localDT=(d=new Date())=>`${hoyISO(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const mmss=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${pad(s%60)}`};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const numOrNull=v=>{if(v==null)return null;const s=String(v).trim().replace(",",".");if(s==="")return null;const n=Number(s);return isFinite(n)?n:null};
const fechaLarga=iso=>{if(!iso)return"Sin fecha";const d=new Date(iso+"T12:00");return d.toLocaleDateString("es",{weekday:"long",day:"numeric",month:"short"})};
const fechaCorta=iso=>{if(!iso)return"";const d=new Date(iso.slice(0,10)+"T12:00");return d.toLocaleDateString("es",{day:"numeric",month:"short"})};
const TIPOC={PUSH:"var(--push)",PULL:"var(--pull)",Piernas:"var(--legs)",Skills:"var(--skill)",Full:"var(--full)","Evaluación":"var(--eval)"};
const ZONAS=["Hombro izq","Hombro der","Codo","Bíceps","Mano o muñeca","Rodilla der","Rodilla izq","Ingle","Espalda","Otra"];
const ESTN={plan:"✓ Como estaba planeado",hecho:"Hecho",ajustado:"Ajustado","omit-t":"Omitido por tiempo","omit-f":"Omitido por fatiga",fallado:"Fallado"};

/* ================= ESTADO ================= */
function load(){
  let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  o=Object.assign({settings:{},dev:null,ev:[],outbox:[],cursor:0,lastSync:0,ses:{list:[],blocks:{},edited:{},at:0},hab:[],habAt:0,mediaPend:[],unlock:{},pendNotion:[]},o||{});
  o.settings=Object.assign({theme:"auto",mute:false,vib:true,syncUrl:"",syncKey:""},o.settings);
  if(!o.dev)o.dev={id:uid(),name:/Mobi|Android|iPhone/i.test(navigator.userAgent)?"Teléfono":"PC"};
  return o;
}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast("⚠ No se pudo guardar en este dispositivo")}}
// Borradores: lo registrado en cada sesión, campo por campo (gana la edición más reciente; se sincroniza)
function loadB(){let o=null;try{o=JSON.parse(localStorage.getItem(BK))}catch(e){}return Object.assign({rows:{},pend:[],cursor:0},o||{})}
let BOR=loadB();
let bSaveH=0;
function cSave(now){clearTimeout(bSaveH);const f=()=>{try{localStorage.setItem(BK,JSON.stringify(BOR))}catch(e){}save()};if(now)f();else bSaveH=setTimeout(f,300)}
const bget=(sid,k)=>{const r=BOR.rows[sid]&&BOR.rows[sid][k];return r?r.v:undefined};
function bset(sid,k,v){const t=Date.now();(BOR.rows[sid]=BOR.rows[sid]||{})[k]={t,v};BOR.pend=BOR.pend.filter(p=>!(p.s===sid&&p.k===k));BOR.pend.push({s:sid,k,t,v});cSave();schedBor()}
// Una serie cuenta como hecha si se marcó ✓ o si tiene un valor escrito (y no está omitida)
const hecha=x=>!!x&&!x.om&&(!!x.ok||(x.r!=null&&String(x.r).trim()!==""));
const exSt=(sid,n)=>Object.assign({s:[]},bget(sid,"e:"+n)||{});
const setEx=(sid,n,st)=>bset(sid,"e:"+n,st);

/* ================= NOTION → SESIÓN ================= */
const plainRt=r=>(r||[]).map(x=>x.t).join("");
const EMO=[["🔥","warm"],["🤸","skill"],["💪","bloque"],["🦵","bloque"],["⏱️","circ"],["⏱","circ"],["🧘","mov"],["📘","nota"],["🧑‍🏫","retro"],["🔍","porej"]];
const isList=b=>["bulleted_list_item","numbered_list_item","to_do"].includes(b.ty);
function secKind(t){for(const[e,k]of EMO)if(t.startsWith(e))return{k,e,rest:t.slice(e.length).replace(/^️/,"").trim()};return null}
function parseTitle(s){
  let min=null;const m=s.match(/\s*·\s*(\d+)\s*min\s*$/i);if(m){min=+m[1];s=s.slice(0,m.index)}
  const i=s.indexOf(":");return{tipo:(i<0?s:s.slice(0,i)).trim(),title:(i<0?s:s.slice(i+1)).trim()||s.trim(),min,full:s.trim()};
}
function parsePrio(t){const s=t.split(":").slice(1).join(":"),set=new Set();
  s.replace(/(\d+)\s*(?:al|a|hasta|-|–)\s*(\d+)|(\d+)/g,(m,a,b,c)=>{if(c)set.add(+c);else for(let i=+a;i<=+b&&i-a<60;i++)set.add(i);return m});return set.size?set:null}
function parseEx(t,b){
  const m=t.match(/^(.+?)\s+[—–]\s+(.+)$/)||t.match(/^(.+?)\s+-\s+(.+)$/);if(!m)return null;
  const segs=m[2].split(/\s*·\s*/),s0=segs[0].trim();
  const d=s0.match(/^(?:(\d+)\s*[×xX]\s*)?(m[áa]x|\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?)\s*(s|seg|segundos)?(?=$|[\s@])/i);
  if(!d)return null;
  const ex={id:b.id,title:t,name:m[1].trim(),sets:d[1]?+d[1]:1,hasSets:!!d[1],unit:d[3]?"s":"reps",max:/^m[áa]x$/i.test(d[2]),notes:[],cues:[],variants:[]};
  if(!ex.max){const p=d[2].split(/[-–]/).map(x=>parseFloat(x.replace(",",".")));ex.lo=p[0];ex.hi=isNaN(p[1])?p[0]:p[1]}
  ex.dose=d[0].trim();
  const rem=s0.slice(d[0].length);ex.lado=/por\s+lado/i.test(rem);
  const c=rem.match(/@\s*(.+)$/);if(c){ex.carga=c[1].trim();const k=ex.carga.match(/(\d+(?:[.,]\d+)?)\s*kg/i);if(k)ex.kg=parseFloat(k[1].replace(",","."))}
  for(const s of segs.slice(1)){const x=s.trim();if(!x)continue;
    let r=x.match(/^(?:descanso\s*)?(\d+)(?::(\d{2}))?(?:\s*[-–]\s*\d+(?::\d{2})?)?\s*(s|seg|min)$/i);
    if(r){ex.restTxt=x.replace(/^descanso\s*/i,"");ex.rest=/min/i.test(r[3])?(+r[1])*60+(+r[2]||0):+r[1];continue}
    r=x.match(/^RIR\s*(.+)$/i);if(r){ex.rir=r[1].trim();continue}
    ex.notes.push(x)}
  for(const k of b.k||[]){const tt=plainRt(k.r).trim(),v=tt.match(/^variantes?\s*:\s*(.+)$/i);
    if(v)ex.variants=v[1].split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);else if(tt)ex.cues.push(k)}
  return ex;
}
function parsePorEj(t){const m=t.match(/^(.+?):\s*(⬆️?|↑|=|⬇️?|↓)\s*(subir|mantener|bajar)?\s*(?:[—–-]\s*([\s\S]*))?$/i);
  if(!m)return{raw:t};const dec=/⬆|↑/.test(m[2])?"up":/⬇|↓/.test(m[2])?"down":"eq";return{name:m[1].trim(),dec,com:(m[4]||"").trim()}}
function parseSes(blocks){
  const S={intro:[],prio:null,secs:[],retro:[],porej:[],nEnt:0,ent:[],exs:[]};let sec=null,mode="intro",num=0;
  const B=blocks||[];
  for(let i=0;i<B.length;i++){const b=B[i],t=plainRt(b.r).trim();
    if(b.ty==="divider"&&B[i+1]&&B[i+1].ty==="heading_3"&&/^📤/.test(plainRt(B[i+1].r).trim()))continue;
    if(b.ty==="heading_3"&&/^📤\s*Entrega/.test(t)){S.nEnt++;mode="ent";S.ent.push(b);continue}
    if(b.ty==="heading_2"||b.ty==="heading_1"){const sk=secKind(t);
      if(sk&&sk.k==="retro"){mode="retro";continue}
      if(sk&&sk.k==="porej"){mode="porej";continue}
      if(sk){mode="sec";sec=Object.assign({kind:sk.k,emoji:sk.e,blocks:[],items:[]},parseTitle(sk.rest));
        if(sec.kind==="circ")sec.circ=/emom/i.test(sec.full)?"emom":/amrap/i.test(sec.full)?"amrap":"circuito";S.secs.push(sec);continue}
      if(mode==="ent")mode=sec?"sec":"intro";
    }
    if(mode==="ent"){S.ent.push(b);continue}
    if(mode==="retro"){S.retro.push(b);continue}
    if(mode==="porej"){if(isList(b)){const p=parsePorEj(t);if(p.raw)S.retro.push(b);else S.porej.push(p)}else S.retro.push(b);continue}
    if(mode==="intro"||!sec){if(/^si falta tiempo\s*:/i.test(t)){S.prio=parsePrio(t);S.intro.push({ty:"_prio",t})}else S.intro.push(b);continue}
    if(isList(b)&&["skill","bloque","circ"].includes(sec.kind)){const ex=parseEx(t,b);if(ex){ex.num=++num;ex.circ=sec.kind==="circ";sec.items.push(ex);S.exs.push(ex);sec.blocks.push({ty:"_ex",ex});continue}}
    if(isList(b)&&["warm","mov"].includes(sec.kind)){sec.items.push(b);sec.blocks.push({ty:"_chk",b});continue}
    sec.blocks.push(b);
  }
  S.decs=new Map(S.porej.map(p=>[norm(p.name),p]));
  S.libres=S.porej.filter(p=>!S.exs.some(e=>norm(e.name)===norm(p.name)));
  return S;
}

/* ================= RENDER DE BLOQUES ================= */
function rtHtml(r){return(r||[]).map(x=>{let s=esc(x.t).replace(/\n/g,"<br>");
  if(x.c)s=`<code>${s}</code>`;if(x.b)s=`<b>${s}</b>`;if(x.i)s=`<i>${s}</i>`;if(x.s)s=`<s>${s}</s>`;if(x.u)s=`<u>${s}</u>`;
  if(x.h&&/^https?:/.test(x.h))s=`<a href="${esc(x.h)}" target="_blank" rel="noopener">${s}</a>`;return s}).join("")}
function blocksHtml(bs){let h="",list=null;
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  for(const b of bs||[]){
    const lt=b.ty==="bulleted_list_item"?"ul":b.ty==="numbered_list_item"?"ol":null;
    if(lt!==list){close();if(lt){h+=`<${lt}>`;list=lt}}
    const kids=b.k&&b.ty!=="table"?blocksHtml(b.k):"";
    switch(b.ty){
      case "_prio":h+=`<div class="prio">⏳ ${esc(b.t)}</div>`;break;
      case "paragraph":h+=plainRt(b.r).trim()?`<p>${rtHtml(b.r)}</p>${kids}`:"";break;
      case "heading_1":case "heading_2":case "heading_3":h+=`<h4>${rtHtml(b.r)}</h4>${kids}`;break;
      case "bulleted_list_item":case "numbered_list_item":h+=`<li>${rtHtml(b.r)}${kids}</li>`;break;
      case "to_do":h+=`<p>${b.ck?"☑":"☐"} ${rtHtml(b.r)}</p>${kids}`;break;

/* ---------- Fondo propio: imágenes elegidas en este dispositivo (IndexedDB; no se sincronizan) ----------
   Igual que en MEXT Forge. De cada imagen se saca el color medio (decide claro/oscuro y el tinte de las tarjetas)
   y los dos tonos más vivos (acento y acento 2). La imagen se guarda tal cual, sin recomprimir; solo si pasa de
   4K se reduce a 3840 px con calidad 0,95. Las tarjetas quedan translúcidas para que se vea la imagen. */
const FONDO={lista:[],cargado:false,act:null,pal0:null,url:"",urlId:"",vel:35};
try{const a=JSON.parse(localStorage.getItem("calistenia.fondo.act")||"null");if(a){FONDO.act=a.id;FONDO.pal0=a.pal}FONDO.vel=+(localStorage.getItem("calistenia.fondo.vel")||35)}catch(e){}
function fondoIdb(){return new Promise((ok,no)=>{const r=indexedDB.open("calistenia-fondo",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function fondoTx(modo,fn){const db=await fondoIdb();return await new Promise((ok,no)=>{const t=db.transaction("f",modo),q=fn(t.objectStore("f"));t.oncomplete=()=>{db.close();ok(q&&q.result)};t.onerror=()=>no(t.error)})}
async function fondoInit(){try{FONDO.lista=(await fondoTx("readonly",st=>st.getAll()))||[];FONDO.lista.sort((a,b)=>a.t-b.t)}catch(e){FONDO.lista=[]}
  FONDO.cargado=true;if(FONDO.act&&!FONDO.lista.some(x=>x.id===FONDO.act))fondoUsar(null);applyTheme();if(view==="home")render()}
function fondoActual(){if(!FONDO.act)return null;return FONDO.lista.find(x=>x.id===FONDO.act)||(!FONDO.cargado&&FONDO.pal0?{id:FONDO.act,pal:FONDO.pal0}:null)}
function fondoUsar(id){FONDO.act=id;const f=id&&FONDO.lista.find(x=>x.id===id);
  try{if(f)localStorage.setItem("calistenia.fondo.act",JSON.stringify({id,pal:f.pal}));else localStorage.removeItem("calistenia.fondo.act")}catch(e){}}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,s,l]}
function fondoLienzo(img,max){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(img,0,0,c.width,c.height);return c}
function fondoPaleta(c){const g=c.getContext("2d").getImageData(0,0,c.width,c.height).data,bins=Array.from({length:12},(_,k)=>({k,w:0,r:0,g:0,b:0}));
  let R=0,G=0,B=0,n=0;
  for(let i=0;i<g.length;i+=4){const r=g[i],gg=g[i+1],b=g[i+2];R+=r;G+=gg;B+=b;n++;
    const[h,s,l]=rgb2hsl(r,gg,b),w=s*(1-Math.abs(2*l-1));if(w<.1)continue;const x=bins[Math.floor(h/30)%12];x.w+=w;x.r+=r*w;x.g+=gg*w;x.b+=b*w}
  const avg=[R/n,G/n,B/n],lum=(.2126*avg[0]+.7152*avg[1]+.0722*avg[2])/255,m=rgb2hsl(...avg);
  const ord=bins.filter(x=>x.w>0).sort((a,b)=>b.w-a.w),col=x=>rgb2hsl(x.r/x.w,x.g/x.w,x.b/x.w);
  const a1=ord[0]?col(ord[0]):[m[0],.55,.5];
  const o2=ord[0]&&ord.find(x=>Math.min(Math.abs(x.k-ord[0].k),12-Math.abs(x.k-ord[0].k))>=2&&x.w>ord[0].w*.08);
  const a2=o2?col(o2):[(a1[0]+35)%360,a1[1],a1[2]];
  return{h:Math.round(a1[0]),s:+a1[1].toFixed(2),h2:Math.round(a2[0]),s2:+a2[1].toFixed(2),bh:Math.round(m[0]),bs:+m[1].toFixed(2),modo:lum<.5?"dark":"light"}}
function fondoVars(p,modo){const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a)=>`hsl(${h} ${Math.round(s*100)}% ${l}%${a!=null?" / "+a:""})`;
  const s1=cl(p.s,.5,.9),s2=cl(p.s2,.45,.85),bs=cl(p.bs,0,.35);
  if(modo==="dark")return{"--bg":hs(p.bh,bs,8),"--surface":hs(p.bh,bs*.8,12,.74),"--surface2":hs(p.bh,bs*.8,19,.8),"--line":hs(p.bh,.2,62,.22),"--text":hs(p.bh,.15,95),"--muted":hs(p.bh,.12,74),
    "--accent":hs(p.h,s1,64),"--accent2":hs(p.h2,s2,68),"--accent-t":hs(p.h,.6,8),"--glow":hs(p.h,s1,55,.26),"--focus":hs(p.h2,s2,72)};
  return{"--bg":hs(p.bh,bs,93),"--surface":hs(p.bh,bs*.6,99,.76),"--surface2":hs(p.bh,bs*.7,94,.82),"--line":hs(p.bh,.2,40,.2),"--text":hs(p.bh,.25,11),"--muted":hs(p.bh,.12,35),
    "--accent":hs(p.h,s1,44),"--accent2":hs(p.h2,s2,36),"--accent-t":"#fff","--glow":hs(p.h,s1,50,.22),"--focus":hs(p.h2,s2,40)}}
function fondoPintar(f,th){const r=document.documentElement,modo=th==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):th;
  const k=f?[f.id,!!f.blob,modo,FONDO.vel].join("|"):"";if(fondoPintar.k===k)return;fondoPintar.k=k;
  for(const v of fondoPintar.vars||[])r.style.removeProperty(v);fondoPintar.vars=[];

  const vs=fondoVars(f.pal,modo);vs["--fvel"]=(FONDO.vel/100).toFixed(2);for(const v in vs){r.style.setProperty(v,vs[v]);fondoPintar.vars.push(v)}

function fondoCargarImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("img"))};im.src=u})}

  o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}

  if(!r){el.classList.remove("on","done");document.body.classList.remove("rest-on");return}

/* Isometría: 3-2-1 y cuenta hacia arriba; avisa al llegar al mínimo y al máximo del objetivo */
function openHold(sid,n,i,f){audioOn();wakeOn();const S=getS(sid),ex=S.exs.find(e=>e.num===n);HOLD={sid,n,i,f,ex,prep:Date.now()+3000,start:null,hit:{}};drawHold(true)}
function drawHold(first){const h=HOLD;if(!h)return;const now=Date.now();
  if(!h.start&&now>=h.prep){h.start=h.prep;beep(1200,.25);vib(80)}
  if(!h.start){const c=Math.ceil((h.prep-now)/1000);if(h.lastC!==c){h.lastC=c;beep(660,.08)}}
  const secs=h.start?(now-h.start)/1000:0,ex=h.ex;
  if(h.start&&ex.lo&&secs>=ex.lo&&!h.hit.lo){h.hit.lo=1;beep(990,.2);vib(150)}
  if(h.start&&ex.hi&&ex.hi!==ex.lo&&secs>=ex.hi&&!h.hit.hi){h.hit.hi=1;alarma()}
  const goal=ex.lo&&secs>=ex.lo;
  const html=`<div class="sheet"><h2>⏱ ${esc(ex.name)} · S${h.i+1}${h.f==="rd"?" · der":ex.lado?" · izq":""}</h2>
    <div class="holdtg">Objetivo: ${esc(ex.max?"máximo con buena técnica":ex.lo===ex.hi?ex.lo+" s":ex.lo+"–"+ex.hi+" s")}</div>
    <div class="holdbig ${h.start?goal?"goal":"":"prep"}" id="holdN">${h.start?Math.floor(secs):Math.ceil((h.prep-now)/1000)}</div>
    <div class="holdtg">${h.start?"segundos":"prepárate"}</div>
    <div class="acts"><button class="btn" data-act="holdx">Cancelar</button><button class="btn pri" data-act="holdok">⏹ Parar y guardar</button></div></div>`;
  if(first||!$("#holdN")){$("#ov").innerHTML=html;$("#ov").classList.add("on")}
  else{const el=$("#holdN");el.textContent=h.start?Math.floor(secs):Math.ceil((h.prep-now)/1000);el.className="holdbig "+(h.start?goal?"goal":"":"prep");el.nextElementSibling.textContent=h.start?"segundos":"prepárate"}
}

/* EMOM / AMRAP: un reloj por sección */
function circTick(){const c=TM.circ,now=Date.now(),el=$("#circT-"+c.si);
  const total=c.min*60,el2=(now-c.start)/1000;
  if(el2<0){if(el)el.textContent="Empieza en "+Math.ceil(-el2);return}

  if(c.type==="emom"){const m=Math.floor(el2/60);if(m!==c.lm){c.lm=m;tmSave();if(m>0){beep(1200,.3);vib(200)}}
    const st=bget(c.sid,"c:"+c.si)||{};if((st.done||0)<m){st.done=m;bset(c.sid,"c:"+c.si,st);const d=$("#circD-"+c.si);if(d)d.textContent=m}

/* ================= SINCRONIZACIÓN ================= */
let syncState="off",syncBusy=false,borH=0;
const conf=()=>!!(DB.settings.syncUrl&&DB.settings.syncKey);
const base=()=>DB.settings.syncUrl.replace(/\/+$/,"");
const H=()=>({Authorization:"Bearer "+DB.settings.syncKey,"Content-Type":"application/json"});
async function post(path,body,ms=15000){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(base()+path,{method:"POST",headers:H(),body:JSON.stringify(body),signal:ctl.signal});
    if(r.status===401){const e=new Error("Clave inválida");e.badkey=true;throw e}
    const j=await r.json().catch(()=>({}));if(!r.ok&&!j.error)throw new Error("HTTP "+r.status);return j}finally{clearTimeout(to)}}
function schedBor(){clearTimeout(borH);borH=setTimeout(()=>{if(conf()&&navigator.onLine!==false)borSync().catch(()=>{})},2500)}
async function borSync(){
  let more=true,g=0,changed=false;
  while(more&&g++<10){const push=BOR.pend.slice(0,300);
    const j=await post("/borrador",{dev:DB.dev.id,since:BOR.cursor,push});if(!j.ok)throw new Error(j.error||"borrador");
    const sent=new Set(push.map(p=>p.s+"|"+p.k+"|"+p.t));BOR.pend=BOR.pend.filter(p=>!sent.has(p.s+"|"+p.k+"|"+p.t));
    for(const r of j.rows||[]){const o=(BOR.rows[r.s]=BOR.rows[r.s]||{}),l=o[r.k];if(!l||r.t>l.t){o[r.k]={t:r.t,v:r.v};changed=true}}
    BOR.cursor=j.cursor||BOR.cursor;more=!!j.more||BOR.pend.length>0}
  cSave(true);if(changed&&!editando())render();
}
const editando=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest("input,textarea"))||$("#ov").classList.contains("on")};
async function subirMedia(){
  for(const id of DB.mediaPend.slice(0,4)){const m=await midbGet(id).catch(()=>null);
    if(!m){DB.mediaPend=DB.mediaPend.filter(x=>x!==id);continue}
    const j=await post("/media/subir",{id,mime:m.type,b64:await blobB64(m)},60000);

}
async function syncNow(manual){
  if(!conf()){syncState="off";return}

  if(navigator.onLine===false){syncState="offline";refreshSync();return}
  syncBusy=true;syncState="busy";refreshSync();
  try{
    if(DB.mediaPend.length)await subirMedia();
    // Una entrega con clips sale solo cuando sus clips ya están en el Worker
    let more=true,g=0,changed=false;
    while(more&&g++<10){
      const ids=new Set(DB.outbox),out=DB.ev.filter(e=>ids.has(e.i)&&!(e.media||[]).some(m=>DB.mediaPend.includes(m))).slice(0,200);
      const j=await post("/sync",{dev:DB.dev.id,since:DB.cursor,events:out});
      const sent=new Set(out.map(e=>e.i));DB.outbox=DB.outbox.filter(i=>!sent.has(i));
      const have=new Set(DB.ev.map(e=>e.i));
      for(const e of j.events||[]){delete e._n;if(!have.has(e.i)){DB.ev.push(e);have.add(e.i);changed=true}}
      DB.cursor=j.cursor||DB.cursor;DB.pendNotion=j.pendNotion||[];more=!!j.more;
    }

const MAXB=5*1024*1024;
function toJpeg(src,w,h,max=1280){const sc=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,"image/jpeg",.82))}
async function framesDe(file){
  const url=URL.createObjectURL(file),v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=url;
  const wait=(ev,ms)=>new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error("tiempo")),ms);v.addEventListener(ev,()=>{clearTimeout(t);ok()},{once:true});v.addEventListener("error",()=>{clearTimeout(t);no(new Error("video"))},{once:true})});
  try{await wait("loadeddata",10000);const out=[],dur=isFinite(v.duration)?v.duration:1;
    for(const f of[.2,.5,.8]){v.currentTime=Math.max(0,dur*f);await wait("seeked",6000);out.push(await toJpeg(v,v.videoWidth,v.videoHeight,960))}
    return out}finally{URL.revokeObjectURL(url)}
}

async function onFile(file){

  try{
    if(file.type.startsWith("image/")){

      if(file.size<=MAXB)toast(`📹 Clip agregado${fr.length?" + "+fr.length+" fotogramas":""}`)}
    else{toast("Ese archivo no es video ni foto");return}
    st.media=list;setEx(t.sid,t.n,st);save();render();syncNow();
  }catch(e){toast("No se pudo agregar: "+e.message)}
}

    <h3>Series por semana</h3><div class="card">${barras(sem,ser)}</div>
    <h3>Por ejercicio</h3><div class="card"><select class="sel" id="progSel">${names.map(n=>`<option ${n===progEx?"selected":""}>${esc(n)}</option>`).join("")}</select>${progEx?chartEj(E,progEx):""}</div>`;
  const pts=k=>E.filter(e=>e.check&&e.check[k]!=null).map(e=>[e.date,e.check[k]]);
  const P=pts("peso"),Su=pts("sueno"),En=pts("energia");
  if(P.length)h+=`<h3>Peso en ayunas (kg)</h3><div class="card">${linea([{c:"var(--accent)",p:P}],"kg")}</div>`;
  if(Su.length||En.length)h+=`<h3>Sueño y energía</h3><div class="card">${Su.length?linea([{c:"var(--pull)",p:Su}],"h"):""}${En.length?linea([{c:"var(--legs)",p:En}],"/5",[1,5]):""}<div class="cleg">${Su.length?`<span><i style="background:var(--pull)"></i>sueño (h)</span>`:""}${En.length?`<span><i style="background:var(--legs)"></i>energía (1–5)</span>`:""}</div></div>`;
  $("#app").innerHTML=h;
}
function chartEj(E,name){const izq=[],der=[],one=[];let unit="reps",lado=false;
  for(const e of E){const x=(e.ejs||[]).find(j=>j.name===name);if(!x)continue;unit=x.unit;lado=x.lado;const k=kgDe(x),lb=k?` · ${String(k).replace(".",",")} kg`:"";
    if(x.lado){const r=x.series.filter(z=>!z.om),mi=r.map(z=>z.r).filter(v=>v!=null),md=r.map(z=>z.rd).filter(v=>v!=null);if(mi.length)izq.push([e.date,Math.max(...mi),lb]);if(md.length)der.push([e.date,Math.max(...md),lb])}
    else{const b=mejorDe(x);if(b!=null)one.push([e.date,b,lb])}}
  const u=unit==="s"?"s":"reps";
  if(lado)return linea([{c:"var(--accent)",p:izq},{c:"var(--pull)",p:der}],u)+`<div class="cleg"><span><i style="background:var(--accent)"></i>izquierda</span><span><i style="background:var(--pull)"></i>derecha</span></div><p class="muted small">Mejor serie de cada sesión.</p>`;
  return linea([{c:"var(--accent)",p:one}],u)+`<p class="muted small">Mejor serie de cada sesión (${u})${one.some(p=>p[2])?"; la etiqueta muestra los kg":""}.</p>`}
function barras(sem,v){const W=320,Hh=120,mx=Math.max(1,...v),bw=W/v.length;
  return `<svg class="csvg" viewBox="0 -14 ${W} ${Hh+30}" role="img">${v.map((n,i)=>{const hh=Math.max(2,(Hh-10)*n/mx);return `<rect x="${i*bw+6}" y="${Hh-hh}" width="${bw-12}" height="${hh}" rx="5" fill="${i===v.length-1?"var(--accent)":"color-mix(in srgb,var(--accent) 45%,var(--surface2))"}"/>${n?`<text class="clbl" x="${i*bw+bw/2}" y="${Hh-hh-4}" text-anchor="middle">${n}</text>`:""}<text class="cax" x="${i*bw+bw/2}" y="${Hh+14}" text-anchor="middle">${fechaCorta(sem[i])}</text>`}).join("")}<line class="cgrid" x1="0" x2="${W}" y1="${Hh}" y2="${Hh}"/></svg>`}
function linea(series,u,fix){const all=series.flatMap(s=>s.p);if(!all.length)return `<p class="muted cvacio">Sin datos todavía.</p>`;
  const W=320,Hh=130,L=30,ds=[...new Set(all.map(p=>p[0]))].sort(),xs=d=>L+(ds.length<2?(W-L)/2:(W-L-10)*ds.indexOf(d)/(ds.length-1));
  let lo=fix?fix[0]:Math.min(...all.map(p=>p[1])),hi=fix?fix[1]:Math.max(...all.map(p=>p[1]));if(hi===lo){hi+=1;lo=Math.max(0,lo-1)}const pd=(hi-lo)*.12;if(!fix){lo-=pd;hi+=pd}
  const ys=v=>Hh-10-(Hh-20)*(v-lo)/(hi-lo),fmt=v=>String(Math.round(v*10)/10).replace(".",",");
  let g=`<line class="cgrid" x1="${L}" x2="${W}" y1="${ys(lo)}" y2="${ys(lo)}"/><line class="cgrid" x1="${L}" x2="${W}" y1="${ys(hi)}" y2="${ys(hi)}"/><text class="cax" x="${L-4}" y="${ys(hi)+3}" text-anchor="end">${fmt(hi)}</text><text class="cax" x="${L-4}" y="${ys(lo)+3}" text-anchor="end">${fmt(lo)}</text>`;
  for(const s of series){if(!s.p.length)continue;g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${s.p.map(p=>xs(p[0])+","+ys(p[1])).join(" ")}"/>`;
    g+=s.p.map((p,i)=>`<circle cx="${xs(p[0])}" cy="${ys(p[1])}" r="4" fill="var(--surface)" stroke="${s.c}" stroke-width="2.5"/>${i===s.p.length-1||s.p.length<=6?`<text class="clbl" x="${xs(p[0])}" y="${ys(p[1])-9}" text-anchor="middle">${fmt(p[1])}${p[2]||""}</text>`:""}`).join("")}
  g+=`<text class="cax" x="${L}" y="${Hh+12}">${fechaCorta(ds[0])}</text>${ds.length>1?`<text class="cax" x="${W}" y="${Hh+12}" text-anchor="end">${fechaCorta(ds[ds.length-1])}</text>`:""}`;
  return `<svg class="csvg" viewBox="0 -10 ${W} ${Hh+26}" role="img" aria-label="Gráfico en ${esc(u)}">${g}</svg>`}

/* ================= EVENTOS ================= */
/* Sin parpadeos (como en MEXT Forge): si la sincronización vuelve a pintar lo mismo, no se toca la pantalla;
   y el botón que tocaste da un pequeño rebote cuando queda marcado. */
(function(){const app=document.getElementById("app"),d=Object.getOwnPropertyDescriptor(Element.prototype,"innerHTML");
  Object.defineProperty(app,"innerHTML",{get(){return d.get.call(app)},set(v){if(v===app.__ult)return;app.__ult=v;d.set.call(app,v)}})})();
let popSel="";
document.addEventListener("click",e=>{popSel="";const b=e.target.closest&&e.target.closest("button");if(!b)return;
  const at=[...b.attributes].filter(a=>a.name.startsWith("data-")).map(a=>`[${a.name}="${CSS.escape(a.value)}"]`).join("");if(at){popSel="button"+at;setTimeout(popAplicar,0)}},true);
function popAplicar(){const b=popSel&&document.querySelector(popSel);popSel="";if(!b||!b.classList.contains("on"))return;
  b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");b.addEventListener("animationend",()=>b.classList.remove("pop"),{once:true})}
let toastH=0;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastH);toastH=setTimeout(()=>t.classList.remove("on"),2600)}
function setSerie(n,i,patch){const st=exSt(cur,n);st.s=st.s||[];while(st.s.length<=i)st.s.push({});st.s[i]=Object.assign({},st.s[i],patch);if(patch.ok||patch.om)delete st.estado;setEx(cur,n,st);return st}
document.addEventListener("click",e=>{
  audioOn();
  const t=e.target.closest("[data-fondo],[data-act],[data-tab],[data-open],[data-theme],[data-mute],[data-vib],[data-dev],[data-var],[data-est],[data-energia],[data-zona],[data-int],[data-sin]");if(!t)return;
  const d=t.dataset,n=d.n!=null?+d.n:null,i=d.i!=null?+d.i:null;
  if(d.fondo){ajAbierto=true;if(e.target.closest(".fx"))fondoQuitar(d.fondo);else{fondoUsar(d.fondo==="none"?null:d.fondo);applyTheme();render()}return}
  if(d.tab){tab=d.tab;view="home";wakeOff();window.scrollTo(0,0);render(true);return}
  if(d.open){cur=d.open;if(!DB.ses.blocks[cur]){toast(conf()?"Descargando la sesión…":"Esta sesión no está descargada");if(conf())syncNow(true);return}view="ses";window.scrollTo(0,0);render(true);return}
  if(d.theme){DB.settings.theme=d.theme;save();applyTheme();render();return}
  if(d.mute){DB.settings.mute=d.mute==="1";save();render();return}
  if(d.vib){DB.settings.vib=d.vib==="1";save();render();return}
  if(d.dev){DB.dev.name=d.dev;save();render();return}
  if(d.var){const st=exSt(cur,+d.var);st.variante=st.variante===d.v?null:d.v;setEx(cur,+d.var,st);render();return}
  if(d.est){const st=exSt(cur,+d.est);st.estado=st.estado===d.v?null:d.v;if(!st.estado)delete st.estado;setEx(cur,+d.est,st);render();return}
  if(d.energia){const c=bget(cur,"chk")||{};c.energia=+d.energia;bset(cur,"chk",c);render();return}
  if(d.zona){ovMode.zona=d.zona;ovMode.txt=$("#molTxt").value;drawMol();return}
  if(d.int){ovMode.int=+d.int;ovMode.txt=$("#molTxt").value;drawMol();return}
  if(d.sin){ovMode.sin[d.sin]=d.v;drawEntrega();return}
  const S=view==="ses"?getS(cur):null,ex=S&&n!=null?S.exs.find(x=>x.num===n):null;
  switch(d.act){
    case "home":view="home";wakeOff();window.scrollTo(0,0);render(true);break;
    case "sync":syncNow(true);break;
    case "refresh":if(!conf()){toast("Configura la nube en Ajustes");break}toast("⟳ Actualizando desde Notion…");syncNow(true);break;
    case "syncsave":DB.settings.syncUrl=$("#sUrl").value.trim();DB.settings.syncKey=$("#sKey").value.trim();save();ajAbierto=true;syncNow(true);break;
    case "export":{const b=new Blob([JSON.stringify({app:"calistenia",v:1,db:Object.assign({},DB,{settings:Object.assign({},DB.settings,{syncKey:""})}),bor:BOR},null,1)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`calistenia-respaldo-${hoyISO()}.json`;a.click();break}
    case "import":$("#imp").click();break;
    case "fondoadd":{ajAbierto=true;const i=$("#fImg");if(i)i.click();break}
    case "empezar":{const c=bget(cur,"chk")||{};bset(cur,"chk",c);bset(cur,"start",Date.now());wakeOn();render();window.scrollTo(0,0);break}
    // ✓ marca la serie (y arranca el descanso); tocarlo otra vez la deshace
    case "sok":{const st=exSt(cur,n),x=(st.s||[])[i]||{};const on=!x.ok;setSerie(n,i,on?{ok:true,om:false}:{ok:false,om:false,r:"",rd:""});if(on&&ex&&ex.rest&&i<ex.sets-1)startRest(ex.rest,`${ex.num}. ${ex.name}`);else if(on&&ex&&ex.rest){const nx=S.exs.find(z=>z.num===n+1&&!z.circ);if(nx)startRest(ex.rest,`siguiente: ${nx.name}`)}render();break}
    case "som":{const st=exSt(cur,n),x=(st.s||[])[i]||{};setSerie(n,i,{om:!x.om,ok:false});render();break}
    case "plan":{const st=exSt(cur,n);if(estadoDe(ex,st)==="plan"&&st.estado==="plan"){delete st.estado}else{st.estado="plan";st.s=Array.from({length:ex.sets},(_,j)=>Object.assign({},(st.s||[])[j],{ok:true,om:false}))}setEx(cur,n,st);render();break}
    case "kgon":{const st=exSt(cur,n);st.kgOn=true;setEx(cur,n,st);render();break}
    case "nota":{const st=exSt(cur,n);st.notaOn=true;setEx(cur,n,st);render();const el=document.querySelector(`[data-exnota="${n}"]`);el&&el.focus();break}
    case "hold":{const x=(exSt(cur,n).s||[])[i]||{};openHold(cur,n,i,ex.lado&&x.r!=null&&String(x.r).trim()!==""?"rd":"r");break}
    case "holdx":HOLD=null;closeOv();break;
    case "holdok":{const h=HOLD;HOLD=null;closeOv();if(h&&h.start){const sec=Math.floor((Date.now()-h.start)/1000);setSerie(h.n,h.i,{[h.f]:String(sec)});
      const st=exSt(cur,h.n),x=st.s[h.i];if(!h.ex.lado||(x.r!=null&&x.r!==""&&x.rd!=null&&x.rd!=="")){setSerie(h.n,h.i,{ok:true});if(h.ex.rest&&h.i<h.ex.sets-1)startRest(h.ex.rest,`${h.ex.num}. ${h.ex.name}`)}
      toast(`⏱ ${sec} s guardados`)}render();break}
    case "rest+":if(TM.rest){TM.rest.end+=15000;TM.rest.total+=15;TM.rest.warned=false;tmSave();drawRest()}break;
    case "restx":TM.rest=null;tmSave();drawRest();break;
    case "mol":abrirMol(n||0);break;
    case "molok":{const m=bget(cur,"m")||[];m.push({n:ovMode.n||0,zona:ovMode.zona,int:ovMode.int,txt:$("#molTxt").value.trim()});bset(cur,"m",m);closeOv();render();toast("⚠️ Molestia anotada: llegará destacada al instructor");break}
    case "molx":{const m=bget(cur,"m")||[];m.splice(i,1);bset(cur,"m",m);render();break}
    case "media":mediaTarget={sid:cur,n};$("#fileIn").value="";$("#fileIn").click();break;
    case "mx":{const st=exSt(cur,n),m=(st.media||[]).splice(i,1)[0];if(m)DB.mediaPend=DB.mediaPend.filter(x=>x!==m.id);setEx(cur,n,st);save();render();break}
    case "cgo":{const sec=S.secs[n];TM.circ={sid:cur,si:n,type:sec.circ,min:sec.min,start:Date.now()+3000,lm:-1};tmSave();beep(660,.1);beep(660,.1,1);beep(660,.1,2);beep(1200,.3,3);wakeOn();render();break}
    case "cstop":TM.circ=null;tmSave();render();break;
    case "c+":case "c-":{const sec=S.secs[n],c=bget(cur,"c:"+n)||{},k=sec.circ==="emom"?"done":"rondas";c[k]=Math.max(0,(c[k]||0)+(d.act==="c+"?1:-1));bset(cur,"c:"+n,c);render();break}
    case "entregar":abrirEntrega();break;
    case "entok":entregar();break;
    case "unlock":DB.unlock[cur]=true;save();render();toast("Puedes corregir y volver a entregar (llegará como una entrega nueva)");break;
    case "ovx":closeOv();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(d.ser){setSerie(+d.ser,+d.i,{[d.f]:t.value});return}
  if(d.chk){const c=bget(cur,"chk")||{};c[d.chk]=t.value;bset(cur,"chk",c);return}
  if(d.exnota){const st=exSt(cur,+d.exnota);st.nota=t.value;setEx(cur,+d.exnota,st);return}
  if(d.cnota){const c=bget(cur,"c:"+d.cnota)||{};c.nota=t.value;bset(cur,"c:"+d.cnota,c);return}
  if(d.gen==="nota"){bset(cur,"nota",t.value);return}
  if(t.id==="fVel"){FONDO.vel=+t.value;try{localStorage.setItem("calistenia.fondo.vel",FONDO.vel)}catch(_){}applyTheme();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.warm){const w=bget(cur,"w")||{};w[t.dataset.warm]=t.checked;bset(cur,"w",w);t.closest(".chk").classList.toggle("on",t.checked);return}
  if(t.id==="fImg"&&t.files.length){const fs=[...t.files];t.value="";fondoAgregar(fs);return}
  if(t.id==="progSel"){progEx=t.value;render();return}
  if(t.id==="fileIn"){onFile(t.files[0]);return}
  if(t.id==="imp"){const f=t.files[0];if(!f)return;f.text().then(s=>{const o=JSON.parse(s);if(o.app!=="calistenia")throw new Error("no es un respaldo de Calistenia");
    const key=DB.settings.syncKey;DB=Object.assign(load(),o.db);DB.settings.syncKey=DB.settings.syncKey||key;BOR=Object.assign(loadB(),o.bor);save();cSave(true);parsed={};render();toast("Respaldo importado")}).catch(err=>toast("No se pudo importar: "+err.message))}
});
document.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details[data-aj]"))ajAbierto=e.target.open},true);
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov"&&ovMode)closeOv()});
window.addEventListener("online",()=>syncNow());
document.addEventListener("visibilitychange",()=>{if(document.hidden){cSave(true);return}tick();if(view==="ses"&&bget(cur,"start"))wakeOn();if(Date.now()-DB.lastSync>60000)syncNow()});
window.addEventListener("pagehide",()=>cSave(true));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);

fondoInit();applyTheme();render(true);drawRest();
if(conf())syncNow();
setInterval(()=>{if(!document.hidden&&conf())syncNow()},5*60000);
</script>
